name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # test_cp5.py gọi vào bản deploy đang sống -> luôn đỏ/chậm trên CI.
      # test_bonus_cicd.py kiểm tra chính workflow này -> chạy ở đây là tự
      # tham chiếu vòng tròn. Cả hai bị loại khỏi lần chạy trong CI.
      - name: Run pytest
        env:
          API_TOKEN: ci-dummy
          REDIS_URL: "fake://"
        run: pytest --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-chat:${{ github.sha }} .

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # RAILWAY_TOKEN là Project Token (Railway dashboard -> Project ->
      # Settings -> Tokens), không phải token API cá nhân. Đặt ở
      # Settings -> Secrets and variables -> Actions -> New repository secret.
      - name: Deploy
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # PUBLIC_URL đặt ở Settings -> Secrets and variables -> Actions ->
      # Variables (không phải Secrets, vì đây là URL public, không phải bí mật).
      - name: Smoke test
        run: |
          sleep 45
          curl -fsS "${{ vars.PUBLIC_URL }}/healthz"
